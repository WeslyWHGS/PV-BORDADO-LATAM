<!DOCTYPE html>
<html lang="es-419">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Compra confirmada! · Método Bordado en Papel</title>
  <meta name="description" content="Tu compra fue confirmada. Accede ahora a tu carpeta con los videos y archivos del Método Bordado en Papel.">
  <meta name="theme-color" content="#3d5a47">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="images/icon.png">
  <link rel="apple-touch-icon" href="images/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400,0..100;0,9..144,500,0..100;0,9..144,600,0..100;0,9..144,700,0..100;1,9..144,400,0..100;1,9..144,500,0..100&family=Alex+Brush&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <style>
    body { min-height: 100vh; }

    .delivery-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .delivery-card {
      max-width: 440px;
      width: 100%;
      background: var(--paper);
      border-radius: var(--r-xl);
      box-shadow: 0 24px 60px -24px oklch(38% 0.045 145 / 0.35);
      overflow: hidden;
      text-align: center;
    }

    .delivery-inner { padding: 40px 32px 36px; }

    .delivery-badge {
      display: inline-flex; align-items: center;
      background: var(--terracotta-deep); color: var(--paper);
      padding: 9px 20px; border-radius: 50px;
      font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; margin-bottom: 26px;
    }

    .delivery-icon {
      width: 70px; height: 70px; margin: 0 auto 22px;
      border-radius: 50%;
      background: var(--terracotta-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
    }

    .delivery-h1 {
      font-family: 'Alex Brush', 'Fraunces', serif;
      font-weight: 400;
      font-style: normal;
      font-size: 42px;
      color: var(--terracotta-deep);
      line-height: 1.15;
      margin-bottom: 18px;
    }

    .delivery-divider {
      width: 46px; height: 2px; background: var(--terracotta);
      border: none; margin: 0 auto 22px;
    }

    .delivery-body {
      color: var(--ink-soft); font-size: 15px; line-height: 1.65;
      margin: 0 auto 28px; max-width: 34ch;
    }

    .delivery-cta {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; background: var(--terracotta-deep); color: var(--paper);
      border: none; border-radius: 50px; padding: 18px 20px;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px;
      letter-spacing: 0.01em; cursor: pointer; text-decoration: none;
      box-shadow: 0 14px 30px -10px oklch(48% 0.140 32 / 0.5);
      margin-bottom: 16px; transition: transform 0.15s var(--ease-out-quart);
    }
    .delivery-cta:hover { transform: translateY(-2px); }
    .delivery-cta svg { flex-shrink: 0; }

    .delivery-note {
      font-size: 12.5px; color: var(--ink-mute);
    }

    .delivery-footer { margin-top: 22px; text-align: center; font-size: 12px; color: var(--ink-mute); }
    .delivery-footer a { color: var(--ink-mute); text-decoration: underline; }

    @media (max-width: 420px) {
      .delivery-h1 { font-size: 36px; }
      .delivery-inner { padding: 34px 22px 30px; }
    }
  </style>
</head>
<body>

  <div class="delivery-page">
    <div class="delivery-card reveal">
      <div class="delivery-inner">

        <span class="delivery-badge">Tu compra fue confirmada</span>

        <div class="delivery-icon">🎉</div>

        <h1 class="delivery-h1">¡Bienvenida al método!</h1>

        <hr class="delivery-divider">

        <p class="delivery-body">Todos tus materiales están listos. Haz clic abajo para acceder a tu carpeta con los videos y archivos del curso.</p>

        <a class="delivery-cta" href="https://drive.google.com/drive/folders/1W4kHVmhfJuPEl6wTCRBxi73O0rA-vYzN?usp=sharing" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          Acceder a mis materiales
        </a>

        <div class="delivery-note">El enlace abre directamente en Google Drive</div>

      </div>
    </div>
  </div>

  <script src="js/site.js" defer></script>

</body>
</html>
